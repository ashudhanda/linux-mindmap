<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Mastery — Flowchart</title>
<meta name="description" content="Linux syllabus as a true animated flowchart: Linux → phases → modules → topics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --text:#fff; --muted:#a1a1aa; --faint:#63636b;
  --border:rgba(255,255,255,.14); --border-strong:rgba(255,255,255,.35);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased}
::selection{background:#fff;color:#000}

/* dotted page background */
.bg-dots{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.13) 1.2px,transparent 1.3px);
  background-size:30px 30px;
  mask-image:radial-gradient(ellipse 100% 100% at 50% 40%,#000 40%,transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse 100% 100% at 50% 40%,#000 40%,transparent 100%);
}
.vignette{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 120% 90% at 50% 30%,transparent 55%,rgba(0,0,0,.75) 100%);}

/* header */
header{position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;align-items:center;gap:14px;padding:14px 22px;
  background:linear-gradient(180deg,rgba(0,0,0,.92),rgba(0,0,0,.55) 70%,transparent);
  pointer-events:none;
}
header>*{pointer-events:auto}
.logo{display:flex;align-items:center;gap:11px}
.logo-mark{width:34px;height:34px;border-radius:10px;background:#fff;color:#000;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  box-shadow:0 0 24px rgba(255,255,255,.3);animation:logoPulse 3s ease-in-out infinite}
@keyframes logoPulse{0%,100%{box-shadow:0 0 24px rgba(255,255,255,.3)}50%{box-shadow:0 0 40px rgba(255,255,255,.5)}}
.logo-text b{display:block;font-size:15px;letter-spacing:-.01em}
.logo-text span{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.hspace{flex:1}
.search-box{position:relative}
.search-box input{background:rgba(17,17,17,.9);border:1px solid var(--border);border-radius:999px;
  color:#fff;font-family:var(--font);font-size:13.5px;padding:10px 18px 10px 40px;width:230px;outline:none;
  transition:border-color .25s,box-shadow .25s,width .3s}
.search-box input:focus{border-color:var(--border-strong);box-shadow:0 0 0 4px rgba(255,255,255,.07);width:280px}
.search-box input::placeholder{color:var(--faint)}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
.hbtn{background:rgba(17,17,17,.9);border:1px solid var(--border);color:#fff;border-radius:10px;
  font-family:var(--font);font-size:14px;font-weight:600;width:38px;height:38px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .2s}
.hbtn:hover{border-color:var(--border-strong);background:#1c1c1c;transform:translateY(-1px)}
.hbtn.wide{width:auto;padding:0 16px;font-size:13px}

/* stage */
#stage{position:fixed;inset:0;z-index:1;cursor:grab}
#stage.panning{cursor:grabbing}
#canvas{width:100%;height:100%;display:block}
#viewport{transition:transform .65s cubic-bezier(.22,1,.36,1);transform-origin:0 0}

/* tree nodes */
.node{cursor:pointer}
.node .box{transition:all .25s ease}
.node:hover .box{stroke:#fff;stroke-width:2}
.node.dim{opacity:.12;pointer-events:none}
.node text{font-family:var(--font);pointer-events:none}
.node .n-label{fill:#fff;font-weight:600}
.node .n-sub{fill:var(--muted);font-weight:500}
.node.root .box{fill:#fff;stroke:#fff;filter:drop-shadow(0 0 26px rgba(255,255,255,.45))}
.node.root .n-label{fill:#000;font-weight:800}
.node.root .n-sub{fill:#333}
.node.phase .box{fill:#101012;stroke:rgba(255,255,255,.4)}
.node.module .box{fill:#0c0c0e;stroke:rgba(255,255,255,.22)}
.node.topic .box{fill:#09090b;stroke:rgba(255,255,255,.13)}
.node.sub .box{fill:#070708;stroke:rgba(255,255,255,.09)}
.node .badge{fill:#fff;font-family:var(--mono);font-weight:500}
.node.phase .badge,.node.module .badge{fill:#0a0a0a}
.node .badge-bg{fill:#fff}
.node.phase .badge-bg,.node.module .badge-bg{fill:#fff}
.node .info-dot{fill:#1a1a1c;stroke:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.node .info-dot:hover{fill:#fff}
.node .info-dot text{fill:#fff;font-weight:700}
.node .info-dot:hover text{fill:#000}
.node.enter .box{animation:nodePop .5s cubic-bezier(.22,1.4,.36,1) both}
@keyframes nodePop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.node.pulse .box{animation:nodePulse 1.1s ease-in-out 2}
@keyframes nodePulse{0%,100%{stroke:#fff}50%{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 18px #fff)}}

/* links */
.link{fill:none;stroke:rgba(255,255,255,.30);stroke-width:1.6}
.link.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLink .7s cubic-bezier(.4,0,.2,1) forwards}
@keyframes drawLink{to{stroke-dashoffset:0}}

/* side panel */
#panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,92vw);z-index:20;
  background:rgba(10,10,10,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-left:1px solid var(--border-strong);
  transform:translateX(102%);transition:transform .5s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
.panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--border)}
.panel-head .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.panel-head h2{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.panel-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:transparent;color:#fff;font-size:16px;cursor:pointer;transition:all .2s}
.panel-close:hover{background:#fff;color:#000}
.panel-body{flex:1;overflow-y:auto;padding:20px 24px 30px}
.panel-body::-webkit-scrollbar{width:8px}
.panel-body::-webkit-scrollbar-thumb{background:#2a2a2e;border-radius:8px}
.pt{font-size:13.5px;color:var(--muted);line-height:1.7;padding:9px 0 9px 20px;position:relative;border-bottom:1px solid rgba(255,255,255,.05)}
.pt::before{content:'';position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:#fff}
.pt code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.09);padding:2px 7px;border-radius:6px;color:#fff}
.psec{margin:20px 0 6px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint)}
.cmds{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.cmds code{font-family:var(--mono);font-size:12px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.14);padding:6px 12px;border-radius:8px;color:#fff}
.plain{font-size:13.5px;color:var(--muted);line-height:1.7;margin-top:6px}
.qa{font-size:13.5px;line-height:1.65;margin-top:8px}
.qa b{color:#fff}

/* hint + counter */
#hint{position:fixed;left:22px;bottom:20px;z-index:10;font-size:12.5px;color:var(--faint);
  background:rgba(10,10,10,.8);border:1px solid var(--border);border-radius:999px;padding:9px 18px;
  backdrop-filter:blur(8px);animation:hintIn 1s ease .8s both}
@keyframes hintIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#counter{position:fixed;right:22px;bottom:20px;z-index:10;font-size:12.5px;color:var(--muted);
  background:rgba(10,10,10,.8);border:1px solid var(--border);border-radius:999px;padding:9px 18px;
  font-variant-numeric:tabular-nums;backdrop-filter:blur(8px);animation:hintIn 1s ease 1s both}
#counter b{color:#fff}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);z-index:30;
  background:#fff;color:#000;font-size:13.5px;font-weight:600;padding:12px 24px;border-radius:999px;
  opacity:0;transition:all .35s;pointer-events:none;box-shadow:0 10px 40px rgba(255,255,255,.25)}
#toast.show{opacity:1;transform:translateX(-50%)}

@media(max-width:640px){
  .search-box input{width:150px}
  .search-box input:focus{width:180px}
  #hint{display:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="bg-dots"></div>
<div class="vignette"></div>

<header>
  <div class="logo">
    <div class="logo-mark">λ</div>
    <div class="logo-text"><b>Linux Mastery</b><span>Flowchart</span></div>
  </div>
  <div class="hspace"></div>
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Search… (Enter)" autocomplete="off">
  </div>
  <button class="hbtn" id="zoomIn" title="Zoom in">+</button>
  <button class="hbtn" id="zoomOut" title="Zoom out">−</button>
  <button class="hbtn wide" id="fitBtn" title="Fit to screen">⤢ Fit</button>
</header>

<div id="stage">
  <svg id="canvas" preserveAspectRatio="xMidYMid meet">
    <g id="viewport"><g id="links"></g><g id="nodes"></g></g>
  </svg>
</div>

<aside id="panel">
  <button class="panel-close" id="panelClose">✕</button>
  <div class="panel-head"><div class="kicker" id="pKicker"></div><h2 id="pTitle"></h2></div>
  <div class="panel-body" id="pBody"></div>
</aside>

<div id="hint">🖱️ Drag to pan · Scroll to zoom · Click boxes to expand</div>
<div id="counter"><b id="visCount">0</b> boxes visible</div>
<div id="toast"></div>

<script>
(function(){
"use strict";
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('canvas'), viewport=document.getElementById('viewport'),
      gLinks=document.getElementById('links'), gNodes=document.getElementById('nodes'),
      stage=document.getElementById('stage'), panel=document.getElementById('panel'),
      pKicker=document.getElementById('pKicker'), pTitle=document.getElementById('pTitle'), pBody=document.getElementById('pBody');

const VGAP=168, LEAF=228;
const SIZE={root:[220,62],phase:[240,58],module:[222,54],topic:[205,48],sub:[198,44]};
const LABEL_MAX={root:20,phase:26,module:26,topic:27,sub:28};

let tree=null, idMap=new Map(), view={x:0,y:0,k:1}, firstRender=true, userMoved=false;

function trunc(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n-1)+'…':s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------------- data → tree ---------------- */
function build(data){
  idMap.clear();
  const root={id:'root',type:'root',name:'LINUX',sub:'Zero → DevOps-ready · 19 modules',expanded:true,children:[]};
  idMap.set('root',root);
  (data.phases||[]).forEach((p,pi)=>{
    const pn={id:'p'+pi,type:'phase',name:'Phase '+(pi+1)+' · '+p.name,sub:p.tagline||'',expanded:true,parent:root,children:[]};
    idMap.set(pn.id,pn);
    (p.modules||[]).forEach(m=>{
      const mn={id:m.id,type:'module',name:m.id.toUpperCase()+' · '+m.name,sub:m.summary||'',
        expanded:false,parent:pn,children:[],data:m};
      idMap.set(mn.id,mn);
      (m.topics||[]).forEach((t,ti)=>{
        const tn={id:m.id+'t'+ti,type:'topic',name:t.name,sub:(t.subtopics||[]).length+' subtopics',
          expanded:false,parent:mn,children:[]};
        idMap.set(tn.id,tn);
        (t.subtopics||[]).forEach((s,si)=>{
          const sn={id:m.id+'t'+ti+'s'+si,type:'sub',name:s.name,sub:(s.points||[]).length+' key points',
            expanded:false,parent:tn,children:[],points:s.points||[]};
          idMap.set(sn.id,sn); tn.children.push(sn);
        });
        mn.children.push(tn);
      });
      pn.children.push(mn);
    });
    root.children.push(pn);
  });
  return root;
}

/* ---------------- layout: tidy top-down tree ---------------- */
function layout(){
  const leaves=[];
  (function walk(n,d){n.depth=d;n.kids=n.expanded?n.children:[];
    if(!n.kids.length)leaves.push(n);else n.kids.forEach(k=>walk(k,d+1));})(tree,0);
  leaves.forEach((l,i)=>{l.x=i*LEAF;});
  (function cx(n){
    if(n.kids.length){n.kids.forEach(cx);n.x=(n.kids[0].x+n.kids[n.kids.length-1].x)/2;}
    n.y=n.depth*VGAP;
  })(tree);
}
function linkPath(p,c){
  const pw=SIZE[p.type][1]/2, ch=SIZE[c.type][1]/2;
  const x1=p.x,y1=p.y+pw, x2=c.x,y2=c.y-ch, my=(y1+y2)/2;
  return 'M '+x1+','+y1+' C '+x1+','+my+' '+x2+','+my+' '+x2+','+y2;
}

/* ---------------- render ---------------- */
function setT(g,x,y){g.style.transform='translate('+x+'px,'+y+'px)';}

function makeNode(n){
  const g=document.createElementNS(NS,'g');
  g.setAttribute('class','node '+n.type); g.dataset.id=n.id;
  const W=SIZE[n.type][0],H=SIZE[n.type][1];
  const box=document.createElementNS(NS,'rect');
  box.setAttribute('class','box');
  box.setAttribute('x',-W/2);box.setAttribute('y',-H/2);
  box.setAttribute('width',W);box.setAttribute('height',H);box.setAttribute('rx',15);
  g.appendChild(box);
  const label=document.createElementNS(NS,'text');
  label.setAttribute('class','n-label');label.setAttribute('text-anchor','middle');
  label.setAttribute('y',n.sub?-3:5);label.setAttribute('font-size',n.type==='root'?17:13.5);
  label.textContent=trunc(n.name,LABEL_MAX[n.type]);
  const title=document.createElementNS(NS,'title');title.textContent=n.name;label.appendChild(title);
  g.appendChild(label);
  if(n.sub){
    const sub=document.createElementNS(NS,'text');
    sub.setAttribute('class','n-sub');sub.setAttribute('text-anchor','middle');
    sub.setAttribute('y',15);sub.setAttribute('font-size',10.5);
    sub.textContent=trunc(n.sub,LABEL_MAX[n.type]+6);
    g.appendChild(sub);
  }
  if(n.type==='module'){
    const dot=document.createElementNS(NS,'g');
    dot.setAttribute('class','info-dot');dot.dataset.info=n.id;
    const c=document.createElementNS(NS,'circle');
    c.setAttribute('cx',W/2-16);c.setAttribute('cy',-H/2+16);c.setAttribute('r',11);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',W/2-16);t.setAttribute('y',-H/2+20);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size',12);t.textContent='i';
    dot.appendChild(c);dot.appendChild(t);g.appendChild(dot);
  }
  if(n.children.length){
    const ind=document.createElementNS(NS,'text');
    ind.setAttribute('class','n-sub');ind.setAttribute('text-anchor','middle');
    ind.setAttribute('y',H/2-9);ind.setAttribute('font-size',11);
    ind.textContent=n.expanded?'▴ collapse':'▾ '+n.children.length+' ↓';
    g.appendChild(ind);
  }
  return g;
}

function render(animateLinks){
  layout();
  const prev=new Map();
  gNodes.querySelectorAll('.node').forEach(el=>{
    prev.set(el.dataset.id,{x:parseFloat(el.dataset.x),y:parseFloat(el.dataset.y)});
  });
  gLinks.innerHTML='';gNodes.innerHTML='';
  const order=[];
  (function walk(n){order.push(n);n.kids.forEach(walk);})(tree);
  order.forEach(n=>{
    if(n===tree)return;
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d',linkPath(n.parent,n));
    path.setAttribute('class','link'+(animateLinks?' draw':''));
    if(animateLinks)path.setAttribute('pathLength','1');
    gLinks.appendChild(path);
  });
  order.forEach((n,i)=>{
    const g=makeNode(n);
    const pr=prev.get(n.id);
    if(pr&&isFinite(pr.x)){
      g.style.transition='none';setT(g,pr.x,pr.y);
    }else{
      g.classList.add('enter');
      g.style.animationDelay=Math.min(n.depth*110+i*22,1100)+'ms';
    }
    gNodes.appendChild(g);
    g.dataset.x=n.x;g.dataset.y=n.y;
    if(pr&&isFinite(pr.x)){
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        g.style.transition='transform .55s cubic-bezier(.22,1,.36,1)';setT(g,n.x,n.y);
      }));
    }else setT(g,n.x,n.y);
  });
  document.getElementById('visCount').textContent=order.length;
}

/* ---------------- view controls ---------------- */
function applyView(){viewport.style.transform='translate('+view.x+'px,'+view.y+'px) scale('+view.k+')';}
function fitView(){
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  idMap.forEach(n=>{
    if(n._x===undefined&&n.x===undefined)return;
    const W=SIZE[n.type][0]/2,H=SIZE[n.type][1]/2;
    if(n.x==null)return;
    x0=Math.min(x0,n.x-W);x1=Math.max(x1,n.x+W);y0=Math.min(y0,n.y-H);y1=Math.max(y1,n.y+H);
  });
  const r=stage.getBoundingClientRect(),pad=80;
  const bw=(x1-x0)+pad*2,bh=(y1-y0)+pad*2;
  const k=Math.max(.12,Math.min(r.width/bw,r.height/bh,1.05));
  view.k=k;
  view.x=r.width/2-((x0+x1)/2)*k;
  view.y=96-y0*k;
  userMoved=false;applyView();
}
function zoomBy(f,cx,cy){
  const r=svg.getBoundingClientRect();
  const mx=cx==null?r.width/2:cx-r.left, my=cy==null?r.height/2:cy-r.top;
  const k2=Math.max(.12,Math.min(3,view.k*f));
  view.x=mx-(mx-view.x)*(k2/view.k);
  view.y=my-(my-view.y)*(k2/view.k);
  view.k=k2;userMoved=true;applyView();
}
function nodeScreen(n){
  const r=svg.getBoundingClientRect();
  return {x:n.x*view.k+view.x,y:n.y*view.k+view.y,w:r.width,h:r.height};
}
function ensureKidsVisible(n){
  if(!n.kids.length)return;
  let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  n.kids.forEach(k=>{const W=SIZE[k.type][0];
    x0=Math.min(x0,k.x-W/2);x1=Math.max(x1,k.x+W/2);y0=Math.min(y0,k.y);y1=Math.max(y1,k.y);});
  const s0=nodeScreen({x:x0,y:y0}),s1=nodeScreen({x:x1,y:y1});
  const r=svg.getBoundingClientRect(),m=120;
  if(s0.x>m&&s1.x<r.width-m&&s0.y>m&&s1.y<r.height-m)return;
  const cx=(x0+x1)/2,cy=(y0+y1)/2;
  view.x=r.width/2-cx*view.k;view.y=r.height/2-cy*view.k;
  userMoved=true;applyView();
}

/* pan */
let panning=false,sx=0,sy=0,vx=0,vy=0;
stage.addEventListener('pointerdown',e=>{
  if(e.target.closest('#panel')||e.target.closest('header'))return;
  panning=true;sx=e.clientX;sy=e.clientY;vx=view.x;vy=view.y;
  stage.classList.add('panning');stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove',e=>{
  if(!panning)return;
  view.x=vx+(e.clientX-sx);view.y=vy+(e.clientY-sy);
  userMoved=true;applyView();
});
stage.addEventListener('pointerup',()=>{panning=false;stage.classList.remove('panning');});
stage.addEventListener('wheel',e=>{e.preventDefault();zoomBy(Math.pow(1.0016,-e.deltaY),e.clientX,e.clientY);},{passive:false});
document.getElementById('zoomIn').addEventListener('click',()=>zoomBy(1.25));
document.getElementById('zoomOut').addEventListener('click',()=>zoomBy(.8));
document.getElementById('fitBtn').addEventListener('click',fitView);
window.addEventListener('resize',()=>{if(!userMoved)fitView();});

/* ---------------- clicks ---------------- */
gNodes.addEventListener('click',e=>{
  const info=e.target.closest('.info-dot');
  if(info){e.stopPropagation();openModulePanel(idMap.get(info.dataset.info));return;}
  const gel=e.target.closest('.node');
  if(!gel)return;
  const n=idMap.get(gel.dataset.id);
  if(!n)return;
  if(n.children.length){
    n.expanded=!n.expanded;
    render(false);
    if(n.expanded)ensureKidsVisible(n);
  }else if(n.type==='sub'){
    openSubPanel(n);
  }
});

/* ---------------- panel ---------------- */
function openPanel(kicker,title,html){
  pKicker.textContent=kicker;pTitle.textContent=title;pBody.innerHTML=html;
  panel.classList.add('open');
}
document.getElementById('panelClose').addEventListener('click',()=>panel.classList.remove('open'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open');});

function openSubPanel(n){
  const path=n.parent.parent.name.split('·')[0].trim()+' → '+n.parent.name;
  openPanel(path,n.name,
    '<div class="psec">Key points</div>'+
    n.points.map(p=>'<div class="pt">'+fmt(p)+'</div>').join(''));
}
function openModulePanel(n){
  const d=n.data||{};
  openPanel('Module · interview proof',n.name,
    (d.summary?'<div class="plain">'+esc(d.summary)+'</div>':'')
    +((d.commands||[]).length?'<div class="psec">Essential commands</div><div class="cmds">'+d.commands.map(c=>'<code>'+esc(c)+'</code>').join('')+'</div>':'')
    +(d.lab?'<div class="psec">Hands-on lab</div><div class="plain">'+esc(d.lab)+'</div>':'')
    +(d.interview_q?'<div class="psec">Top interview question</div><div class="qa"><b>Q. '+esc(d.interview_q)+'</b><br><br>'+fmt(d.interview_a||'')+'</div>':''));
}

/* ---------------- search ---------------- */
document.getElementById('search').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const q=e.target.value.trim().toLowerCase();
  if(!q)return;
  let found=null;
  const queue=[tree];
  while(queue.length&&!found){
    const n=queue.shift();
    if(n!==tree&&(n.name.toLowerCase().includes(q)))found=n;
    queue.push(...n.children);
  }
  document.querySelectorAll('.node.pulse').forEach(el=>el.classList.remove('pulse'));
  if(!found){toast('No match for "'+e.target.value.trim()+'"');return;}
  let p=found.parent;
  while(p){p.expanded=true;p=p.parent;}
  render(false);
  const r=svg.getBoundingClientRect();
  const k=Math.max(view.k,.85);
  view.k=k;
  view.x=r.width/2-found.x*k;view.y=r.height/2-found.y*k;
  userMoved=true;applyView();
  const el=gNodes.querySelector('[data-id="'+found.id+'"]');
  if(el){el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),2400);}
  if(found.type==='sub')openSubPanel(found);
});

/* ---------------- boot ---------------- */
fetch('data/syllabus.json')
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
  .then(data=>{
    tree=build(data);
    render(true);
    firstRender=false;
    requestAnimationFrame(()=>setTimeout(fitView,60));
    setTimeout(()=>toast('Click any box to expand its branches'),1400);
  })
  .catch(err=>{
    document.getElementById('visCount').textContent='!';
    toast('Could not load data/syllabus.json');
    console.error(err);
  });
})();
</script>
